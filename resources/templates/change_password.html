<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* 基础重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            line-height: 1.5;
        }

        /* 主容器 */
        .password-container {
            width: 100%;
            max-width: 500px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
            padding: 30px;
            border: 1px solid #eaeaea;
        }

        /* 头部样式 */
        .password-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f0f0f0;
        }

        .password-header h1 {
            color: #2c3e50;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .password-header h1 i {
            color: #3498db;
            margin-right: 10px;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 14px;
            font-weight: 400;
        }

        /* 用户信息卡片 */
        .user-info-card {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            border-left: 4px solid #3498db;
            text-align: center;
        }

        .user-info-item {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .user-info-item .label {
            color: #555;
            font-weight: 500;
            display: flex;
            align-items: center;
        }

        .user-info-item .label i {
            margin-right: 8px;
            width: 16px;
            text-align: center;
        }

        .user-info-item .value {
            color: #2c3e50;
            font-weight: 600;
            font-size: 18px;
        }

        /* 密码区域 */
        .password-section {
            margin-bottom: 30px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            gap: 8px;
        }

        .btn-start {
            background-color: #3498db;
            color: white;
            width: 100%;
        }

        .btn-start:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }

        .btn-primary {
            background-color: #2ecc71;
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            background-color: #27ae60;
        }

        .btn-secondary {
            background-color: #95a5a6;
            color: white;
            flex: 1;
        }

        .btn-secondary:hover {
            background-color: #7f8c8d;
        }

        .btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* 密码表单 */
        .password-form {
            margin-top: 25px;
            display: none;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 500;
            font-size: 15px;
        }

        .form-group label i {
            margin-right: 8px;
            color: #3498db;
        }

        .input-with-icon {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-with-icon input {
            width: 100%;
            padding: 14px 16px;
            padding-right: 45px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-with-icon input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            color: #7f8c8d;
            cursor: pointer;
            font-size: 16px;
        }

        .toggle-password:hover {
            color: #3498db;
        }

        .password-requirements {
            font-size: 13px;
            color: #7f8c8d;
            margin-top: 6px;
        }

        /* 错误和成功消息 */
        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 6px;
            display: none;
        }

        .success-message {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
            display: none;
            align-items: center;
            gap: 12px;
        }

        .success-message i {
            font-size: 24px;
            color: #28a745;
        }

        .success-content p {
            margin-top: 4px;
            font-size: 14px;
            color: #0c4128;
        }

        /* 表单操作按钮 */
        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        /* 页脚 */
        .password-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
            font-size: 14px;
        }

        .back-link {
            color: #3498db;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #2980b9;
            text-decoration: underline;
        }

        .security-tip {
            color: #7f8c8d;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .security-tip i {
            color: #f39c12;
        }

        /* 加载遮罩 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 响应式调整 */
        @media (max-width: 600px) {
            .password-container {
                padding: 20px;
                box-shadow: none;
                border: none;
            }

            .password-header h1 {
                font-size: 24px;
            }

            .form-actions {
                flex-direction: column;
            }

            .password-footer {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
<div class="password-container">
    <div class="password-header">
        <h1><i class="fas fa-key"></i> 修改密码</h1>
        <p class="subtitle">请确保新密码足够安全</p>
    </div>

    <div class="user-info-card">
        <div class="user-info-item">
            <span class="label"><i class="fas fa-user"></i> 当前用户：</span>
            <span class="value" id="username">加载中...</span>
        </div>
    </div>

    <div class="password-section">
        <button class="btn btn-start" id="changePasswordBtn">
            <i class="fas fa-edit"></i> 开始修改密码
        </button>

        <div class="password-form" id="passwordFields">
            <div class="form-group">
                <label for="newPassword">
                    <i class="fas fa-lock"></i> 新密码
                </label>
                <div class="input-with-icon">
                    <input type="password" id="newPassword" placeholder="请输入新密码（至少6位字符）">
                    <i class="fas fa-eye toggle-password" id="toggleNewPassword"></i>
                </div>
                <div class="password-requirements">
                    密码要求：至少6位字符，建议包含字母、数字和符号
                </div>
                <div class="error-message" id="passwordError"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">
                    <i class="fas fa-lock"></i> 确认新密码
                </label>
                <div class="input-with-icon">
                    <input type="password" id="confirmPassword" placeholder="请再次输入新密码">
                    <i class="fas fa-eye toggle-password" id="toggleConfirmPassword"></i>
                </div>
                <div class="error-message" id="confirmError"></div>
            </div>

            <div class="form-actions">
                <button class="btn btn-primary" id="submitBtn">
                    <i class="fas fa-check"></i> 确认修改
                </button>
                <button class="btn btn-secondary" id="cancelBtn">
                    <i class="fas fa-times"></i> 取消
                </button>
            </div>

            <div class="success-message" id="successMessage">
                <i class="fas fa-check-circle"></i>
                <div class="success-content">
                    <strong>密码修改成功！</strong>
                    <p>页面将在3秒后自动跳转...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="password-footer">
        <a href="javascript:history.back()" class="back-link">
            <i class="fas fa-arrow-left"></i> 返回上一页
        </a>
        <div class="security-tip">
            <i class="fas fa-shield-alt"></i> 安全提示：请勿使用过于简单的密码
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <p>处理中，请稍候...</p>
    </div>
</div>

<script>
    // API基础URL - 根据你的实际情况修改
    const API_BASE_URL = window.location.origin; // 自动获取当前域名

    // 页面加载完成后执行
    document.addEventListener('DOMContentLoaded', function() {
        console.log('修改密码页面加载完成');

        // 获取DOM元素
        const changePasswordBtn = document.getElementById('changePasswordBtn');
        const passwordFields = document.getElementById('passwordFields');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const passwordError = document.getElementById('passwordError');
        const confirmError = document.getElementById('confirmError');
        const successMessage = document.getElementById('successMessage');
        const usernameDisplay = document.getElementById('username');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const toggleNewPasswordBtn = document.getElementById('toggleNewPassword');
        const toggleConfirmPasswordBtn = document.getElementById('toggleConfirmPassword');

        // 1. 页面加载时获取当前用户信息
        loadCurrentUserInfo();

        // 2. 修改密码按钮点击事件
        changePasswordBtn.addEventListener('click', function() {
            console.log('修改密码按钮被点击');

            // 显示密码输入区域
            passwordFields.style.display = 'block';

            // 隐藏修改密码按钮
            changePasswordBtn.style.display = 'none';

            // 焦点聚焦到新密码输入框
            setTimeout(() => {
                newPasswordInput.focus();
            }, 100);
        });

        // 3. 提交按钮点击事件
        submitBtn.addEventListener('click', async function() {
            console.log('提交按钮被点击');

            // 获取输入值
            const newPassword = newPasswordInput.value.trim();
            const confirmPassword = confirmPasswordInput.value.trim();

            // 重置错误消息
            passwordError.style.display = 'none';
            confirmError.style.display = 'none';
            successMessage.style.display = 'none';

            // 验证新密码
            if (!newPassword) {
                showError(passwordError, '新密码不能为空');
                newPasswordInput.focus();
                return;
            }

            if (newPassword.length < 6) {
                showError(passwordError, '密码长度不能少于6位');
                newPasswordInput.focus();
                return;
            }

            // 验证确认密码
            if (!confirmPassword) {
                showError(confirmError, '请确认新密码');
                confirmPasswordInput.focus();
                return;
            }

            if (newPassword !== confirmPassword) {
                showError(confirmError, '两次输入的密码不一致');
                confirmPasswordInput.focus();
                return;
            }

            // 显示加载状态
            showLoading(true);

            try {
                console.log('开始修改密码...');

                // 调用后端API修改密码
                const result = await updateUserPassword(newPassword);

                if (result.success) {
                    console.log('密码修改成功');

                    // 显示成功消息
                    successMessage.style.display = 'flex';

                    // 清空输入框
                    newPasswordInput.value = '';
                    confirmPasswordInput.value = '';

                    // 3秒后返回上一页
                    setTimeout(() => {
                        window.history.back();
                    }, 3000);
                } else {
                    console.error('密码修改失败:', result.message);
                    showError(passwordError, '密码修改失败: ' + result.message);
                }
            } catch (error) {
                console.error('请求出错:', error);
                showError(passwordError, '网络错误，请检查连接: ' + error.message);
            } finally {
                // 隐藏加载状态
                showLoading(false);
            }
        });

        // 4. 取消按钮点击事件
        cancelBtn.addEventListener('click', function() {
            // 隐藏密码输入区域
            passwordFields.style.display = 'none';

            // 显示修改密码按钮
            changePasswordBtn.style.display = 'flex';

            // 清空输入框和错误信息
            newPasswordInput.value = '';
            confirmPasswordInput.value = '';
            passwordError.style.display = 'none';
            confirmError.style.display = 'none';
            successMessage.style.display = 'none';
        });

        // 5. 显示/隐藏密码功能
        toggleNewPasswordBtn.addEventListener('click', function() {
            togglePasswordVisibility(newPasswordInput, toggleNewPasswordBtn);
        });

        toggleConfirmPasswordBtn.addEventListener('click', function() {
            togglePasswordVisibility(confirmPasswordInput, toggleConfirmPasswordBtn);
        });

        // 6. 按Enter键提交
        newPasswordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                submitBtn.click();
            }
        });

        confirmPasswordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                submitBtn.click();
            }
        });
    });

    // 加载当前用户信息
    async function loadCurrentUserInfo() {
        try {
            console.log('正在获取当前用户信息...');
            showLoading(true);

            // 获取用户名
            const usernameResponse = await fetch(`${API_BASE_URL}/api/auth/users/Name`, {
                method: 'GET',
                headers: getHeaders()
            });

            if (usernameResponse.ok) {
                const username = await usernameResponse.text();
                console.log('获取到用户名:', username);

                // 更新页面显示
                document.getElementById('username').textContent = username;
            } else {
                console.error('获取用户名失败:', usernameResponse.status);
                document.getElementById('username').textContent = '获取失败';

                // 如果未登录，跳转到登录页
                if (usernameResponse.status === 401 || usernameResponse.status === 403) {
                    alert('您未登录或会话已过期，请重新登录');
                    window.location.href = '/login.html';
                }
            }
        } catch (error) {
            console.error('获取用户信息时出错:', error);
            document.getElementById('username').textContent = '加载失败';
        } finally {
            showLoading(false);
        }
    }

    // 修改用户密码
    async function updateUserPassword(newPassword) {
        try {
            console.log('正在修改密码...');

            const response = await fetch(`${API_BASE_URL}/api/auth/password/change`, {
                method: 'PUT',
                headers: getHeaders(),
                body: JSON.stringify({
                    password: newPassword
                })
            });

            console.log('修改密码响应状态:', response.status);

            if (response.ok) {
                return {
                    success: true,
                    message: '密码修改成功'
                };
            } else {
                // 尝试获取错误信息
                let errorMessage = '未知错误';
                try {
                    const errorText = await response.text();
                    if (errorText) {
                        errorMessage = errorText;
                    }
                } catch (e) {
                    // 如果无法解析响应文本，使用状态码
                    errorMessage = `HTTP ${response.status}`;
                }

                return {
                    success: false,
                    message: errorMessage
                };
            }
        } catch (error) {
            console.error('修改密码请求失败:', error);
            return {
                success: false,
                message: '网络请求失败: ' + error.message
            };
        }
    }

    // 显示错误信息
    function showError(element, message) {
        element.textContent = message;
        element.style.display = 'block';
    }

    // 显示/隐藏加载状态
    function showLoading(isLoading) {
        const loadingOverlay = document.getElementById('loadingOverlay');
        if (isLoading) {
            loadingOverlay.style.display = 'flex';
        } else {
            loadingOverlay.style.display = 'none';
        }
    }

    // 切换密码可见性
    function togglePasswordVisibility(passwordInput, toggleButton) {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleButton.classList.remove('fa-eye');
            toggleButton.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            toggleButton.classList.remove('fa-eye-slash');
            toggleButton.classList.add('fa-eye');
        }
    }

    // 获取请求头（包含认证信息）
    function getHeaders() {
        const headers = {
            'Content-Type': 'application/json'
        };

        // 尝试获取JWT token
        const token = getToken();
        if (token) {
            headers['Authorization'] = `Bearer ${token}`;
        }

        return headers;
    }

    // 获取JWT token（根据你的前端存储方式调整）
    function getToken() {
        // 尝试从多个地方获取token
        const tokenSources = [
            localStorage.getItem('token'),
            localStorage.getItem('jwt'),
            sessionStorage.getItem('token'),
            sessionStorage.getItem('jwt'),
            getCookie('token'),
            getCookie('jwt')
        ];

        for (const token of tokenSources) {
            if (token && token !== 'null' && token !== 'undefined') {
                return token;
            }
        }

        return null;
    }

    // 获取Cookie值
    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
        return null;
    }

    // 全局错误处理
    window.addEventListener('error', function(e) {
        console.error('全局错误:', e.message, '在', e.filename, '第', e.lineno, '行');
    });

    // 添加调试信息
    console.log('API基础URL:', API_BASE_URL);
    console.log('当前页面URL:', window.location.href);
</script>
</body>
</html>

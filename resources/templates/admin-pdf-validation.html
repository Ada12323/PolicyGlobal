<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF链接验证管理 - 政策分析系统</title>
    <script src="/js/jquery-1.8.0.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #2c3e50 0%, #1a1a2e 100%);
            color: white;
            padding: 20px 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .header-left p {
            font-size: 14px;
            opacity: 0.8;
        }

        .header-right a {
            color: white;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 5px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .header-right a:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .control-panel {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .control-panel h2 {
            font-size: 22px;
            color: #2c3e50;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-panel h2 i {
            color: #3498db;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 8px;
            padding: 20px;
            border-left: 4px solid #3498db;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
        }

        .stat-card.invalid {
            border-left-color: #e74c3c;
        }

        .stat-card.valid {
            border-left-color: #2ecc71;
        }

        .stat-card.pending {
            border-left-color: #f39c12;
        }

        .stat-card h3 {
            font-size: 14px;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 36px;
            font-weight: 700;
            color: #2c3e50;
        }

        .stat-card .unit {
            font-size: 14px;
            color: #95a5a6;
            margin-left: 5px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #2980b9 0%, #1f639e 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
        }

        .btn-danger:hover {
            background: linear-gradient(135deg, #c0392b 0%, #a93226 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
        }

        .btn-success:hover {
            background: linear-gradient(135deg, #27ae60 0%, #219653 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
            color: white;
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, #7f8c8d 0%, #6c7b7d 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(149, 165, 166, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .progress-section {
            margin-top: 30px;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            display: none;
        }

        .progress-section.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .progress-header h3 {
            font-size: 18px;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-bar {
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3498db 0%, #2ecc71 100%);
            border-radius: 5px;
            width: 0%;
            transition: width 0.5s ease;
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            color: #7f8c8d;
            font-size: 14px;
        }

        .invalid-policies-section {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .section-header h2 {
            font-size: 22px;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-header h2 i {
            color: #e74c3c;
        }

        .section-controls {
            display: flex;
            gap: 10px;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        thead {
            background: linear-gradient(135deg, #2c3e50 0%, #1a1a2e 100%);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        tbody tr {
            border-bottom: 1px solid #e0e0e0;
            transition: background 0.3s ease;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        td {
            padding: 15px;
            color: #2c3e50;
        }

        .policy-title {
            font-weight: 600;
            max-width: 250px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pdf-url {
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pdf-url a {
            color: #3498db;
            text-decoration: none;
        }

        .pdf-url a:hover {
            text-decoration: underline;
        }

        .check-result {
            color: #e74c3c;
            font-size: 14px;
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .check-time {
            font-size: 12px;
            color: #7f8c8d;
        }

        .action-cell {
            width: 80px;
        }

        .btn-small {
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 4px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #7f8c8d;
        }

        .empty-state i {
            font-size: 60px;
            margin-bottom: 20px;
            color: #bdc3c7;
        }

        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #7f8c8d;
        }

        .empty-state p {
            font-size: 16px;
        }

        .bulk-select {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .selected-count {
            background: #3498db;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 14px;
            display: none;
        }

        .selected-count.active {
            display: inline-block;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal {
            background: white;
            border-radius: 10px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .modal h3 {
            font-size: 20px;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .modal p {
            color: #7f8c8d;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 25px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 1001;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .toast.success {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        }

        .toast.error {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .toast.info {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .section-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .section-controls {
                width: 100%;
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 头部 -->
    <header>
        <div class="header-left">
            <h1><i class="fas fa-file-pdf"></i> PDF链接验证管理</h1>
            <p>验证政策PDF链接有效性，清理失效链接</p>
        </div>
        <div class="header-right">
            <a href="/"><i class="fas fa-arrow-left"></i> 返回系统首页</a>
        </div>
    </header>

    <!-- 控制面板 -->
    <div class="control-panel">
        <h2><i class="fas fa-sliders-h"></i> 控制面板</h2>

        <!-- 统计数据 -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>总政策数</h3>
                <div class="value" id="totalPolicies">--</div>
                <span class="unit">条</span>
            </div>
            <div class="stat-card invalid">
                <h3>失效链接</h3>
                <div class="value" id="invalidCount">0</div>
                <span class="unit">条</span>
            </div>
            <div class="stat-card valid">
                <h3>有效链接</h3>
                <div class="value" id="validCount">--</div>
                <span class="unit">条</span>
            </div>
            <div class="stat-card pending">
                <h3>上次验证</h3>
                <div class="value" id="lastCheckTime">--</div>
                <span class="unit"></span>
            </div>
        </div>

        <!-- 控制按钮 -->
        <div class="button-group">
            <button id="startValidationBtn" type="button" class="btn btn-primary">
                <i class="fas fa-play-circle"></i> 开始验证所有PDF链接
            </button>
            <button id="refreshStatsBtn" class="btn btn-secondary">
                <i class="fas fa-sync-alt"></i> 刷新统计数据
            </button>
            <button id="loadInvalidBtn" class="btn btn-danger">
                <i class="fas fa-search"></i> 查看失效政策
            </button>
            <button id="selectAllBtn" class="btn btn-secondary" style="display: none;">
                <i class="fas fa-check-square"></i> 全选
            </button>
            <button id="deleteSelectedBtn" class="btn btn-danger" style="display: none;">
                <i class="fas fa-trash"></i> 删除选中
            </button>
        </div>

        <!-- 验证进度 -->
        <div class="progress-section" id="progressSection">
            <div class="progress-header">
                <h3><i class="fas fa-tasks"></i> 验证进度</h3>
                <button id="cancelTaskBtn" class="btn btn-small btn-secondary">
                    <i class="fas fa-times"></i> 取消任务
                </button>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-stats">
                <div>
                    进度: <span id="progressPercentage">0%</span>
                </div>
                <div>
                    已处理: <span id="processedCount">0</span> / <span id="totalCount">0</span>
                </div>
                <div>
                    有效: <span id="currentValidCount">0</span> | 失效: <span id="currentInvalidCount">0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 失效政策列表 -->
    <div class="invalid-policies-section">
        <div class="section-header">
            <h2><i class="fas fa-exclamation-triangle"></i> 失效政策列表</h2>
            <div class="section-controls">
                <div class="bulk-select">
                    <input type="checkbox" id="selectAllCheckbox">
                    <label for="selectAllCheckbox">全选</label>
                    <span class="selected-count" id="selectedCount">0</span>
                </div>
                <button id="refreshListBtn" class="btn btn-secondary">
                    <i class="fas fa-redo"></i> 刷新列表
                </button>
            </div>
        </div>

        <div class="table-container">
            <table id="invalidPoliciesTable">
                <thead>
                <tr>
                    <th width="50"><input type="checkbox" id="tableSelectAll"></th>
                    <th>政策标题</th>
                    <th>PDF链接</th>
                    <th>失效原因</th>
                    <th>验证时间</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody id="invalidPoliciesBody">
                <!-- 数据将通过JS动态加载 -->
                </tbody>
            </table>
        </div>

        <!-- 空状态 -->
        <div class="empty-state" id="emptyState">
            <i class="far fa-file-pdf"></i>
            <h3>暂无失效政策</h3>
            <p>所有PDF链接验证有效，或尚未执行验证</p>
        </div>
    </div>
</div>

<!-- 确认删除模态框 -->
<div class="modal-overlay" id="deleteModal">
    <div class="modal">
        <h3><i class="fas fa-exclamation-triangle"></i> 确认删除</h3>
        <p id="deleteMessage">您确定要删除选中的政策吗？此操作不可撤销，请谨慎操作。</p>
        <div class="modal-buttons">
            <button class="btn btn-secondary" id="cancelDeleteBtn">取消</button>
            <button class="btn btn-danger" id="confirmDeleteBtn">确认删除</button>
        </div>
    </div>
</div>

<!-- Toast提示 -->
<div class="toast" id="toast"></div>

<script src="/js/admin-pdf-validation.js"></script>
</body>
</html>

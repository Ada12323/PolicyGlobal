<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>智能体深度检索 - 政策分析系统</title>
  <link rel="stylesheet" th:href="@{/css/main.css?v=20250916a}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="ambient">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="bg"></div>
</div>
<header>
  <h1>政策分析系统</h1>
  <nav>
    <a href="/">首页</a>
    <a href="/wordcloud">统计</a>
    <a href="/agent">智能体检索</a>
    <a href="/admin" id="adminLink" style="display:none;">管理</a>
    <a href="/login" id="loginLink">登录</a>
    <a href="#" id="logoutLink" style="display:none;">退出</a>
  </nav>
</header>
<main class="container">
  <section class="card" style="padding:18px">
    <div class="tabs" style="justify-content:space-between">
      <div style="font-weight:700">检索时间与数量</div>
    </div>
    <div class="form-grid">
      <div class="field">
        <label class="small muted">开始日期</label>
        <input type="date" id="aStart" />
      </div>
      <div class="field">
        <label class="small muted">结束日期</label>
        <input type="date" id="aEnd" />
      </div>
      <div class="field">
        <div class="label-row">
          <label class="small muted">数量（10-50）</label>
          <div class="small">当前：<span id="aLimitVal">20</span></div>
        </div>
        <input type="range" id="aLimit" min="10" max="50" step="1" value="20" oninput="document.getElementById('aLimitVal').textContent=this.value" />
      </div>
      <div class="form-actions form-actions-inline">
        <button id="btnCrawl" class="btn btn-primary">
          <span>开始检索</span>
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="field field-orgs" style="grid-column:1 / -1;">
        <div class="label-row org-title-row">
          <label class="small muted">追踪机构（至少选择一个）</label>
        </div>
        <div class="org-zone">
          <div class="org-block org-block-select">
            <div class="org-block-head">
              <div class="org-block-label">机构筛选</div>
              <div class="org-select-actions small">
                <button type="button" id="orgToggleBtn" class="chip-action chip-expand">展开更多</button>
                <button type="button" id="orgSelectAll" class="chip-action chip-select-all">全选</button>
                <button type="button" id="orgSelectClear" class="chip-action chip-clear">清空</button>
              </div>
            </div>
            <div class="org-select-wrapper" id="orgSelectWrapper" data-collapsed="true">
              <div id="orgSelect" class="org-select"></div>
            </div>
            <div id="orgSelectHint" class="small muted" style="display:none;">请至少勾选一个机构。</div>
          </div>
          <div class="org-block org-block-add">
            <div class="org-block-label">新增追踪机构</div>
            <div class="org-add-grid">
              <input type="text" id="orgAddName" placeholder="新增机构名称（必填）" autocomplete="off" />
              <input type="url" id="orgAddUrl" placeholder="参考链接（可选）" autocomplete="off" />
              <button type="button" id="orgAddBtn" class="btn btn-outline">新增</button>
            </div>
            <div id="orgAddMsg" class="small muted" style="display:none;"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <section class="card" style="padding:18px">
    <div style="font-weight:700;margin-bottom:8px">智能体思考</div>
    <div id="chatArea" class="chat-area"></div>
  </section>
</main>

<!-- 弹窗结构 -->
<div id="customModal" class="modal" style="display: none;">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">操作提示</h3>
      <span class="close-btn">&times;</span>
    </div>
    <div class="modal-body">
      <p id="modalMessage">这里是弹窗消息内容</p>
    </div>
    <div class="modal-footer">
      <button id="confirmBtn" class="btn btn-primary">确定</button>
      <button id="cancelBtn" class="btn btn-secondary" style="display: none;">取消</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
<script th:src="@{/js/common.js?v=20250916}"></script>
<script th:src="@{/js/assistant-widget.js?v=20250930a}"></script>
<script th:src="@{/js/agent.js?v=20250916}"></script>
<script th:src="@{/js/particles-bg.js?v=20250916}"></script>
</body>
</html>

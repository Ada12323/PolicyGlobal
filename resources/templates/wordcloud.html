<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <title>统计 - 政策分析系统</title>
  <link rel="stylesheet" th:href="@{/css/main.css?v=20250916a}" />
  <style>
    /* 缩小词云外框高度，减少上下留白 */
  #wc { width: 100%; height: 480px; }
  #barChart, #pieChart { width: 100%; height: 400px; }
  @media (max-width: 900px){ #wc{ height: 400px } #barChart, #pieChart{ height: 330px } }
  </style>
</head>
<body>
<div class="ambient">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="bg"></div>
</div>
<header>
  <a href="/">首页</a>
</header>
<main class="container">
  <h2>统计概览</h2>
  <div class="cloud-wrap" style="padding:8px">
    <div class="cloud-inner" style="margin:0">
      <div id="wc"></div>
    </div>
  </div>
  <section class="panel" style="margin-top:12px">
    <div class="panel-title">统计图</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div>
        <div class="chart-title">词频 Top15</div>
        <div id="barChart"></div>
      </div>
      <div>
        <div class="chart-title">机构分布（Top10 + 其他）</div>
        <div id="pieChart"></div>
      </div>
    </div>
  </section>
</main>
<script th:src="@{/js/common.js?v=20250916}"></script>
<script th:src="@{/js/assistant-widget.js?v=20250930a}"></script>
<script th:src="@{/js/wordcloud.js?v=20250916b}"></script>
<script th:src="@{/js/echarts-loader.js?v=20250916}"></script>
<script th:src="@{/js/particles-bg.js?v=20250916}"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>登录 - 政策分析系统</title>
  <link rel="stylesheet" th:href="@{/css/main.css?v=20250916a}" />
</head>
<body class="page-login">
  <div class="ambient">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="bg"></div>
  </div>
  <div class="layout-center" style="max-width:560px;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <div style="width:12px;height:12px;border-radius:3px;background:linear-gradient(90deg,var(--brand),var(--brand2));box-shadow:0 6px 14px rgba(99,102,241,.25)"></div>
      <h2 style="margin:0;font-size:22px;font-weight:800;background:linear-gradient(90deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent">登录你的账户</h2>
    </div>
    <div class="card" style="padding:22px;display:grid;gap:12px">
      <label class="small muted">用户名</label>
      <input id="username" type="text" placeholder="请输入用户名" />
      <label class="small muted" style="margin-top:6px">密码</label>
      <input id="password" type="password" placeholder="请输入密码" />
      <button id="btnLogin" style="margin-top:8px">进入系统</button>
      <div id="login-msg" class="msg"></div>
      <p class="small">首次使用？管理员账号 admin（密码请以数据库为准）。</p>
    </div>
    <!-- 积木块装饰 -->
    <div style="display:grid;grid-template-columns:repeat(12,1fr);gap:8px;margin-top:14px">
      <div style="grid-column:span 3;height:10px;border-radius:6px;background:rgba(99,102,241,.18)"></div>
      <div style="grid-column:span 2;height:10px;border-radius:6px;background:rgba(34,197,94,.18)"></div>
      <div style="grid-column:span 4;height:10px;border-radius:6px;background:rgba(56,189,248,.18)"></div>
      <div style="grid-column:span 3;height:10px;border-radius:6px;background:rgba(99,102,241,.12)"></div>
      <div style="grid-column:span 5;height:10px;border-radius:6px;background:rgba(34,197,94,.12)"></div>
      <div style="grid-column:span 2;height:10px;border-radius:6px;background:rgba(56,189,248,.12)"></div>
    </div>
  </div>
  <script th:src="@{/js/common.js?v=20250915}"></script>
  <script th:src="@{/js/login.js?v=20250915}"></script>
  <script th:src="@{/js/particles-bg.js?v=20250916}"></script>
</body>
</html>

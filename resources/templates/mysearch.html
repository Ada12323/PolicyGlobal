<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>全部政策信息</title>
    <link rel="stylesheet" th:href="@{/css/main.css?v=20250916a}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/js/jquery-1.8.0.js"></script>
    <style>
        /* 1. 主容器：包裹筛选区和列表区，用Flex横向排列 */
        .content-container {
            display: flex; /* 横向排列子元素 */
            min-height: calc(100vh - 120px); /* 高度 = 视口高度 - 顶部header高度（根据实际调整） */
            margin: 20px auto;
            width: 90%; /* 整体宽度，可根据需求调整 */
            gap: 20px; /* 筛选区和列表区之间的间距 */
        }

        /* 2. 左侧筛选区：固定20%宽度，可添加内边距优化样式 */
        .filter-section {
            width: 30%;
            min-width: 280px; /* 最小宽度，防止屏幕过窄时挤压 */
            background: #fff; /* 背景色，与列表区分开（可选） */
            padding: 20px;
            border-radius: 8px; /* 圆角（可选） */
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); /* 阴影（可选） */
        }

        /* 3. 右侧列表区：占剩余80%宽度 */
        .policy-list-section {
            width: 70%;
            background: #fff; /* 背景色（可选） */
            padding: 20px;
            border-radius: 8px; /* 圆角（可选） */
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); /* 阴影（可选） */
        }

        /* 4. 确保列表容器继承父区宽度，避免内容溢出 */
        #allPolicy {
            width: 100%;
            height: 100%;
        }
        #addPolicyList {
            width: 100%;
        }

        /* 新增：搜索和排序控件样式 */
        .search-sort-container {
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 40px 10px 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 2px rgba(0,123,255,0.25);
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
        }

        .sort-controls {
            display: flex;
            gap: 10px;
        }

        .sort-controls select {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            background-color: white;
            cursor: pointer;
        }

        .sort-controls select:focus {
            outline: none;
            border-color: #007bff;
        }

        .results-count {
            color: #6c757d;
            font-size: 14px;
            margin-top: 10px;
        }

        /* 政策卡片美化 */
        .policy-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            border-left: 4px solid #007bff;
        }

        .policy-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .policy-title {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 10px;
            color: #333;
        }

        .policy-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 10px;
            font-size: 14px;
            color: #6c757d;
        }

        .policy-meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .policy-summary {
            color: #555;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 机构筛选区块样式 */
        .org-block {
            margin-top: 20px;
        }

        .org-block-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .org-block-label {
            font-weight: 600;
            color: #333;
        }

        .org-select-actions {
            display: flex;
            gap: 10px;
        }

        .chip-action {
            background: none;
            border: none;
            color: #007bff;
            font-size: 12px;
            cursor: pointer;
            padding: 2px 5px;
        }

        .chip-action:hover {
            text-decoration: underline;
        }

        .org-select-wrapper {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            padding: 10px;
        }

        .org-option {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .org-option input {
            margin: 0;
        }

        .org-option a {
            margin-left: auto;
            font-size: 12px;
        }

        /* 空状态样式 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6c757d;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 15px;
            color: #dee2e6;
        }

        .empty-state h3 {
            margin-bottom: 10px;
            color: #6c757d;
        }
    </style>
</head>
<body>
<div class="ambient">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="blob b4"></div>
    <div class="bg"></div>
</div>
<header>
    <h1>政策分析系统</h1>
    <nav>
        <a href="/" >首页</a>
        <a href="/wordcloud">统计</a>
        <a href="/agent" sec:authorize="hasRole('ADMIN')">智能体检索</a>
        <a href="/favorite" class="favorite-btn">我的收藏</a>
        <a href="/admin" id="adminLink" style="display:none;">管理</a>
        <a href="/login" id="loginLink">登录</a>
        <a href="#" id="logoutLink" style="display:none;">退出</a>
    </nav>
</header>
<!-- 新增：内容主容器（筛选区 + 列表区） -->
<div class="content-container">
    <!-- 左侧：筛选功能区（30%宽度） -->
    <div class="filter-section">
        <h3>政策筛选</h3>

        <!-- 搜索和排序控件 -->
        <div class="search-sort-container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索政策标题或摘要...">
                <i class="fas fa-search search-icon"></i>
            </div>
            <div class="sort-controls">
                <select id="sortField">
                    <option value="publishDate">按发布时间</option>
                    <option value="rating">按评分排序</option> <!-- 新增选项 -->
                </select>
                <select id="sortOrder">
                    <option value="desc">从新到旧</option>
                    <option value="asc">从旧到新</option>
                </select>
            </div>
        </div>
        <div class="results-count" id="resultsCount">共 0 条政策</div>

        <div class="org-block org-block-select">
            <div class="org-block-head">
                <div class="org-block-label">机构筛选</div>
                <div class="org-select-actions small">
                    <button type="button" id="orgToggleBtn" class="chip-action chip-expand">展开更多</button>
                    <button type="button" id="orgSelectAll" class="chip-action chip-select-all">全选</button>
                    <button type="button" id="orgSelectClear" class="chip-action chip-clear">清空</button>
                </div>
            </div>
            <div class="org-select-wrapper" id="orgSelectWrapper" data-collapsed="true">
                <div id="orgSelect" class="org-select"></div>
            </div>
            <div id="orgSelectHint" class="small muted" style="display:none;">请至少勾选一个机构。</div>
        </div>
    </div>

    <!-- 右侧：政策列表区（70%宽度，原allPolicy区域移入此处） -->
    <div class="policy-list-section">
        <div id="allPolicy" class="tab-panel active">
            <ul id="addPolicyList" class="grid"></ul>
        </div>
    </div>
</div>

<script th:src="@{/js/common.js?v=20250917b}"></script>
<script th:src="@{/js/assistant-widget.js?v=20250930a}"></script>
<script th:src="@{/js/home.js?v=20250917b}"></script>
<script th:src="@{/js/particles-bg.js?v=20250917b}"></script>
<script th:src="@{/js/ambient.js?v=20250917b}"></script>
<script src="/js/mysearch.js"></script>
</body>
</html>
